name: CI

# Auto-runs disabled (manual trigger only). The live site deploys via
# Hostinger's native GitHub integration — not GitHub Actions — and jobs on this
# account fail to start (they end in a few seconds before any step runs), which
# only produced misleading red checks on every push/PR. Restore the
# push / pull_request triggers below once GitHub Actions runners are available.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
